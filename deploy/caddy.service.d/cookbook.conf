# Drop-in for Caddy's packaged caddy.service: gives it the cookbook's settings and caps and
# sandboxes it like the app, because the host shares its CPU and memory with other services.
# Host-specific paths it must never see go in another drop-in in this directory
# (InaccessiblePaths=...).

[Service]
# COOKBOOK_DOMAIN, COOKBOOK_ACME_EMAIL and DUCKDNS_TOKEN (see README.md)
EnvironmentFile=/etc/cookbook/caddy.env
# The packaged unit runs caddy with --environ, which prints the environment, token included,
# to the journal.
ExecStart=
ExecStart=/usr/bin/caddy run --config /etc/caddy/Caddyfile

NoNewPrivileges=yes
ProtectSystem=strict
# Certificates, the ACME account and autosaved config live under the caddy user's home.
ReadWritePaths=/var/lib/caddy
ProtectHome=yes
PrivateDevices=yes
ProtectProc=invisible
ProcSubset=pid
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
RestrictNamespaces=yes
RestrictSUIDSGID=yes
LockPersonality=yes
SystemCallArchitectures=native

Nice=5
MemoryMax=150M
