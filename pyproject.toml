[project]
name = "cookbook"
version = "0.1.0"
description = "A self-hosted recipe web app for a home network"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.163.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "pillow>=13.0.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.33",
    "reportlab>=5.1.0",
    "tomli-w>=1.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
cookbook = "cookbook.cli:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=1.15",
    "playwright>=1.65.2",
    "pypdf>=7.1.0",
    "pytest<9",
    "pytest-cases>=3.10",
    "pytest-mock>=3.14",
    "ruff>=0.11",
    "types-reportlab>=5.1.0.20261104",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
extend-select = ["E", "F", "I", "UP", "B", "D209", "D213", "ANN401", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"unittest.mock".msg = "Use pytest-mock's mocker fixture."
"os.environ".msg = "Read settings through cookbook.settings.Settings."
"os.getenv".msg = "Read settings through cookbook.settings.Settings."
"os.putenv".msg = "Read settings through cookbook.settings.Settings."
"dataclasses".msg = "Use pydantic models."

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not smoke'"
markers = ["smoke: drives the running app in a phone-sized Chromium (scripts/lint-and-test.sh runs them)"]
